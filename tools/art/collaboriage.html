<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Collaboriage</title>
<style>
  body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:12px}
  label{display:block;margin-top:8px}
  input[type=number]{width:80px}
  #previewWrap{display:flex;gap:12px;margin-top:12px}
  #preview{position:relative;border:1px solid #ccc}
  #gridOverlay{position:absolute;left:0;top:0;pointer-events:none}
  #legend{height:300px;overflow:auto;border:1px solid #ccc;padding:6px;margin-top:8px}
  .legendItem{display:flex;align-items:center;gap:8px;margin:4px 0}
  .colorSquare{width:28px;height:20px;border:1px solid #666}
  #info{margin-top:8px}
  button{margin-top:8px}
</style>
</head>
<body>
<h2>Collaboriage : Faire un coloriage collaboratif à partir d'une image</h2>
<label>Importer une image: <input id="file" type="file" accept="image/*"></label>
<div id="info">Aucune image</div>
<h3>Redimensionner l'image</h3>
<label>Largeur (en carrés/pixels) :
  <input id="squareWidth" type="number" min="1" value="100">
</label>
<label>Format :
  <select id="orientation"><option value="portrait">Portrait (A4)</option><option value="landscape">Paysage (A4)</option></select>
</label>
<label>Nombre de couleurs (approx.): <input id="numColors" type="number" min="2" value="8"></label>
<label>Largeur du dessin en nombre de pages : <input id="pageCols" type="number" min="1" value="3"></label>
<div id="derived">→ Pages totales: <span id="totalPages">—</span></div>
<button id="apply">Appliquer</button>
<button id="exportPdf">Export PDF</button>
<div id="previewWrap">
  <div>
    <div id="preview"><canvas id="canvas"></canvas><svg id="gridOverlay"></svg></div>
  </div>
  <div style="width:360px">
    <div id="legend" aria-live="polite"></div>
  </div>
</div>

<!-- jsPDF CDN -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
const fileInput = document.getElementById('file');
const squareWidthInput= document.getElementById('squareWidth');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const numColorsInput = document.getElementById('numColors');
const pageColsInput = document.getElementById('pageCols');
const orientationSelect = document.getElementById('orientation');
const legendDiv = document.getElementById('legend');
const info = document.getElementById('info');
const applyBtn = document.getElementById('apply');
const exportBtn = document.getElementById('exportPdf');
const totalPagesSpan = document.getElementById('totalPages');
const gridOverlay = document.getElementById('gridOverlay');

let img = new Image();
let imgPixels = null; // Uint8ClampedArray
let w = 0, h = 0;
let quantized = null; // array of {r,g,b}
let assignedCodes = {}; // colorHex -> code
let palette = []; // array of hex colors

// helper: hex
function rgbToHex(r,g,b){return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();}
function hexToRgb(hex){hex=hex.replace('#','');return {r:parseInt(hex.slice(0,2),16),g:parseInt(hex.slice(2,4),16),b:parseInt(hex.slice(4,6),16)}}
function luminance([r,g,b]){return 0.2126*r+0.7152*g+0.0722*b}

// generate codes A..Z, AA..ZZ
function* codeGenerator(){
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for(let len=1; len<=2; len++){
    const counters = Array(len).fill(0);
    while(true){
      yield counters.map(i=>letters[i]).join('');
      // increment
      let pos = len-1; counters[pos]++;
      while(pos>=0 && counters[pos]===26){counters[pos]=0; pos--; if(pos>=0) counters[pos]++;}
      if(pos<0 && counters.every(c=>c===0)) break; // finished (after ZZ)
    }
  }
}

// k-means simple on colors
function kmeans(pixels, k, maxIter=12){
  // pixels: array of [r,g,b]
  if(pixels.length===0) return [];
  // init centers by sampling
  const centers = [];
  for(let i=0;i<k;i++){centers.push(pixels[Math.floor(Math.random()*pixels.length)].slice())}
  const assignments = new Array(pixels.length).fill(0);
  for(let iter=0; iter<maxIter; iter++){
    let changed = false;
    // assign
    for(let i=0;i<pixels.length;i++){
      let best=0, bestd=Infinity;
      for(let c=0;c<centers.length;c++){
        const dr = pixels[i][0]-centers[c][0];
        const dg = pixels[i][1]-centers[c][1];
        const db = pixels[i][2]-centers[c][2];
        const d = dr*dr+dg*dg+db*db;
        if(d<bestd){bestd=d; best=c}
      }
      if(assignments[i]!==best){assignments[i]=best; changed=true}
    }
    // recompute centers
    const sums = Array(k).fill(0).map(()=>[0,0,0,0]); // r,g,b,count
    for(let i=0;i<pixels.length;i++){
      const c = assignments[i];
      sums[c][0]+=pixels[i][0]; sums[c][1]+=pixels[i][1]; sums[c][2]+=pixels[i][2]; sums[c][3]++;
    }
    for(let c=0;c<k;c++){
      if(sums[c][3]>0){centers[c][0]=Math.round(sums[c][0]/sums[c][3]); centers[c][1]=Math.round(sums[c][1]/sums[c][3]); centers[c][2]=Math.round(sums[c][2]/sums[c][3]);}
    }
    if(!changed) break;
  }
  return centers;
}

function resizeImageData(srcCanvas, newW, newH) {
  const tmp = document.createElement('canvas');
  tmp.width = newW;
  tmp.height = newH;
  const tctx = tmp.getContext('2d');
  tctx.imageSmoothingEnabled = false; // IMPORTANT : conserve les pixels nets
  tctx.drawImage(srcCanvas, 0, 0, newW, newH);
  return tctx.getImageData(0, 0, newW, newH);
}

function updateImg() {
  w = img.naturalWidth; h = img.naturalHeight;

  canvas.width = w; canvas.height = h;
  canvas.style.maxWidth = '800px'; canvas.style.height = 'auto';
  ctx.drawImage(img,0,0);

  // --- REDIMENSIONNEMENT AVANT TOUT ---
  const targetW = parseInt(squareWidth.value, 10); // largeur en carrés
  const targetH = Math.round(h * (targetW / w));  // conserve le ratio

  // redimensionner sur un canvas temporaire
  const resized = resizeImageData(canvas, targetW, targetH);

  // remplacer les dimensions par celles redimensionnées
  w = targetW;
  h = targetH;

  // mettre le canvas principal à la taille redimensionnée
  canvas.width = w;
  canvas.height = h;

  // remettre l'image redimensionnée dans le canvas principal
  ctx.putImageData(resized, 0, 0);

  // mettre à jour les pixels sources utilisés pour la posterisation
  imgPixels = resized.data;

  // mettre à jour les infos affichées
  info.innerText = `Image redimensionnée : ${w} x ${h} carrés`;


  const d = ctx.getImageData(0,0,w,h);
  imgPixels = d.data;
  info.innerText = `Image: ${w} x ${h} px`;
  runPosterize();
  updateDerived();
  drawPreview();
}

fileInput.addEventListener('change', e=>{
  const f = e.target.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  img = new Image();
  img.onload = ()=>{
    updateImg();
  };
  img.src = url;
});

squareWidthInput.addEventListener('change', ()=>{ // 'change' or 'input'
  updateImg();
});

function updateDerived(){
  if(!w) return;
  const pageCols = Math.max(1,parseInt(pageColsInput.value)||1);
  const pageWidthMM = orientationSelect.value==='portrait'?210:297;
  // pixelsPerPageWidth
  const pixelsPerPageWidth = Math.ceil(w / pageCols);
  // scale mm per pixel
  const S = pageWidthMM / pixelsPerPageWidth; // mm per pixel
  // pixels per page height
  const pageHeightMM = orientationSelect.value==='portrait'?297:210;
  const pixelsPerPageHeight = Math.floor(pageHeightMM / S) || 1;
  const pageRows = Math.ceil(h / pixelsPerPageHeight);
  const total = pageRows * pageCols;
  totalPagesSpan.innerText = `${total} (grille ${pageCols} x ${pageRows})`;
}

applyBtn.addEventListener('click', ()=>{
  if(!imgPixels){alert('Importer une image d\'abord');return}
  runPosterize();
});

applyBtn.addEventListener('click', ()=>{
  if(!imgPixels){alert('Importer une image d\'abord');return}
  runPosterize();
});

function drawPreview(){
  if(!img) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0);
  drawGridOverlay();
}

function drawGridOverlay(){
  const pageCols = Math.max(1,parseInt(pageColsInput.value)||1);
  const pageWidthMM = orientationSelect.value==='portrait'?210:297;
  const pixelsPerPageWidth = Math.ceil(w / pageCols);
  const S = pageWidthMM / pixelsPerPageWidth; // mm/pixel
  // Need to map mm to screen pixels for overlay scale: compute mm per image px in screen
  const displayedWidth = canvas.clientWidth; // css px
  const scale = displayedWidth / w; // css px per image pixel
  const pageWidthPxScreen = pixelsPerPageWidth * scale;
  const pixelsPerPageHeight = Math.floor((orientationSelect.value==='portrait'?297:210) / S) || 1;
  const pageRows = Math.ceil(h / pixelsPerPageHeight);
  gridOverlay.setAttribute('width', canvas.clientWidth);
  gridOverlay.setAttribute('height', canvas.clientHeight);
  gridOverlay.style.width = canvas.clientWidth+'px';
  gridOverlay.style.height = canvas.clientHeight+'px';
  gridOverlay.innerHTML = '';
  // draw vertical page boundaries
  for(let c=0;c<=pageCols;c++){
    const x = Math.round(c * pageWidthPxScreen);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x); line.setAttribute('y1',0); line.setAttribute('x2',x); line.setAttribute('y2',canvas.clientHeight);
    line.setAttribute('stroke','#FF0000'); line.setAttribute('stroke-width',1); line.setAttribute('stroke-dasharray','4 4');
    gridOverlay.appendChild(line);
  }
  // horizontal
  const pageHeightPxScreen = pixelsPerPageHeight * scale;
  for(let r=0;r<=pageRows;r++){
    const y = Math.round(r*pageHeightPxScreen);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',0); line.setAttribute('y1',y); line.setAttribute('x2',canvas.clientWidth); line.setAttribute('y2',y);
    line.setAttribute('stroke','#FF0000'); line.setAttribute('stroke-width',1); line.setAttribute('stroke-dasharray','4 4');
    gridOverlay.appendChild(line);
  }
}

// Posterization pipeline
function runPosterize(){
  const k = Math.max(2,Math.min(676,parseInt(numColorsInput.value)||8));
  // sample pixels excluding fully transparent
  const pixels = [];
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i = (y*w+x)*4; const a = imgPixels[i+3];
      if(a===0) continue;
      const r = imgPixels[i], g=imgPixels[i+1], b=imgPixels[i+2];
      // ignore white for clustering? we still want preserve white as transparent background -> exclude
      if(r===255 && g===255 && b===255) continue;
      pixels.push([r,g,b]);
    }
  }
  const centers = kmeans(pixels, Math.min(k, Math.max(2, Math.min(200, k))));
  // if centers less than k, fill by duplicates
  while(centers.length<k){centers.push(centers[centers.length-1].slice());}
  // compute palette sorted from light -> dark
  palette = centers.map(c=>rgbToHex(c[0],c[1],c[2]));
  palette.sort((a,b)=>{
    const A=hexToRgb(a), B=hexToRgb(b); return luminance([A.r,A.g,A.b]) - luminance([B.r,B.g,B.b]);
  });
  // assign codes skipping white
  assignedCodes = {};
  const gen = codeGenerator();
  for(const col of palette){ assignedCodes[col] = gen.next().value; }
  // create quantized image map: for each pixel find nearest palette color; white remains null
  quantized = new Array(w*h);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4; const r=imgPixels[i], g=imgPixels[i+1], b=imgPixels[i+2];
      if(r===255 && g===255 && b===255){ quantized[y*w+x] = null; continue; }
      // find nearest in palette
      let best = null, bestd=Infinity;
      for(const hex of palette){ const c = hexToRgb(hex); const dr=r-c.r, dg=g-c.g, db=b-c.b; const d=dr*dr+dg*dg+db*db; if(d<bestd){bestd=d; best=hex} }
      quantized[y*w+x] = best;
    }
  }
  renderLegend();
  drawQuantizedPreview();
  updateDerived();
}

function renderLegend(){
  legendDiv.innerHTML = '';
  // build list vertical, multi-column if many: simply create columns with CSS flex-wrap
  const items = Object.keys(assignedCodes).map(hex=>({hex,code:assignedCodes[hex]}));
  // ensure sorted by luminance (we already sorted palette)
  for(const it of items){
    const row = document.createElement('div'); row.className='legendItem';
    const sq = document.createElement('div'); sq.className='colorSquare'; sq.style.background = it.hex;
    const txt = document.createElement('div'); txt.innerText = `${it.code} — ${it.hex}`;
    row.appendChild(sq); row.appendChild(txt);
    legendDiv.appendChild(row);
  }
}

function drawQuantizedPreview(){
  // draw quantized small view on canvas
  const scale = Math.min(800/w, 600/h, 1);
  canvas.width = w; canvas.height = h;
  ctx.clearRect(0,0,w,h);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const v = quantized[y*w+x];
      if(v===null){ ctx.fillStyle='#FFFFFF'; ctx.fillRect(x,y,1,1); }
      else{ ctx.fillStyle = v; ctx.fillRect(x,y,1,1); }
    }
  }
  canvas.style.width = Math.round(w*scale)+'px'; canvas.style.height = Math.round(h*scale)+'px';
  drawGridOverlay();
}

// Export PDF vectoriel using jsPDF (mm units)
exportBtn.addEventListener('click', async ()=>{
  if(!quantized){alert('Appliquer posterisation d\'abord');return}
  const { jsPDF } = window.jspdf;
  const orientation = orientationSelect.value;
  const doc = new jsPDF({ unit:'mm', format:'a4', orientation });

  const pageWidthMM = orientation==='portrait'?210:297;
  const pageHeightMM = orientation==='portrait'?297:210;
  const pageCols = Math.max(1,parseInt(pageColsInput.value)||1);
  const pixelsPerPageWidth = Math.ceil(w / pageCols);
  const S = pageWidthMM / pixelsPerPageWidth; // mm per pixel (size of each square)
  const pixelsPerPageHeight = Math.floor(pageHeightMM / S) || 1;
  const pageRows = Math.ceil(h / pixelsPerPageHeight);

  // create codes mapping for quick lookup
  const codes = assignedCodes; // hex -> code

  // iterate pages: col index then row (A1, A2...)
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  function colLabel(i){
    // 0 -> A, 25 -> Z, 26 -> AA
    let label='';
    i++; // 1-based
    while(i>0){ const rem = (i-1)%26; label = String.fromCharCode(65+rem) + label; i = Math.floor((i-1)/26); }
    return label;
  }

  for(let r=0;r<pageRows;r++){
    for(let c=0;c<pageCols;c++){
      if(!(r===0 && c===0)) doc.addPage();
      // compute page origin in pixels
      const originX = c * pixelsPerPageWidth;
      const originY = r * pixelsPerPageHeight;
      // draw squares
      for(let py=0; py<pixelsPerPageHeight; py++){
        const imgY = originY + py;
        if(imgY>=h) break;
        for(let px=0; px<pixelsPerPageWidth; px++){
          const imgX = originX + px;
          if(imgX>=w) break;
          const v = quantized[imgY*w + imgX];
          const x_mm = px * S;
          const y_mm = py * S;
          if(v===null){
            // empty square: stroke
            doc.setDrawColor(127,127,127);
            doc.setFillColor(255,255,255);
            doc.rect(x_mm, y_mm, S, S);
          } else {
            const rgb = hexToRgb(v);
            // doc.setFillColor(rgb.r, rgb.g, rgb.b);
            doc.setDrawColor(127,127,127);
            doc.setFillColor(255,255,255);
            // doc.rect(x_mm, y_mm, S, S, 'F');
            doc.rect(x_mm, y_mm, S, S);
            // draw code text centered
            const code = codes[v] || '';
            if(code){
              // choose font size to fit
              const fontSize = Math.max(4, Math.floor(S*0.35));
              doc.setFontSize(fontSize);
              doc.setTextColor(127,127,127);
              const textX = x_mm + S/2;
              const textY = y_mm + S/2 + fontSize*0.35;
              doc.text(code, textX, textY, {align:'center', baseline:'middle'});
            }
          }
        }
      }
      // footer with page coordinate
      const label = `${colLabel(c)}${r+1}`;
      doc.setFontSize(8);
      doc.setTextColor(0,0,0);
      doc.text(label, pageWidthMM - 12, pageHeightMM - 6);
    }
  }

  // legend page (one page)
  doc.addPage();
  doc.setFontSize(12); doc.text('Légende', 10, 12);
  // items per column
  const items = Object.keys(codes).map(h=>({hex:h,code:codes[h]}));
  const cols = 2; // adjust if many
  const colGap = 10; const colW = (pageWidthMM - 20 - colGap*(cols-1))/cols;
  const itemHeight = 10;
  let colIdx = 0, rowIdx=0;
  for(let i=0;i<items.length;i++){
    const colLeft = 10 + colIdx*(colW+colGap);
    const y = 20 + rowIdx*itemHeight;
    const it = items[i];
    // square
    const rgb = hexToRgb(it.hex);
    doc.setFillColor(rgb.r,rgb.g,rgb.b);
    doc.rect(colLeft, y-6, 8,8,'F');
    doc.setFontSize(10);
    doc.setTextColor(0,0,0);
    doc.text(`${it.code}`, colLeft+12, y);
    rowIdx++;
    if((y + itemHeight) > pageHeightMM - 20){ colIdx++; rowIdx=0; if(colIdx>=cols) break; }
  }

  // final: save
  doc.save('vectorized_pages.pdf');
});

// keep grid overlay in sync
pageColsInput.addEventListener('input', ()=>{ if(img) drawGridOverlay(); updateDerived(); });
orientationSelect.addEventListener('change', ()=>{ if(img) drawGridOverlay(); updateDerived(); });

</script>
</body>
</html>
