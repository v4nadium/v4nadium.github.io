<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Trouver une maison par surface parcelle et bâti</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script type="module">
  import pako from "https://cdn.jsdelivr.net/npm/pako@2.1.0/+esm";
  import * as turf from "https://cdn.jsdelivr.net/npm/@turf/turf@7/+esm";

  let map;
  const datasets = {
    A: { data: null, layer: null, color: "#0074D9" },
    B: { data: null, layer: null, color: "#FF4136" }
  };

  document.addEventListener("DOMContentLoaded", () => {
    initMap();
    initUI();
  });

  function initMap() {
    map = L.map("map").setView([46.6, 2.5], 6);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);
  }

  function initUI() {
    const searchInput = document.getElementById("communeInput");
    const resultsDiv = document.getElementById("results");

    let timeout = null;

    searchInput.addEventListener("input", async () => {
      const q = searchInput.value.trim();
      resultsDiv.innerHTML = "";
      if (q.length < 3) return;

      clearTimeout(timeout);
      timeout = setTimeout(async () => {
        try {
          const url = `https://tabular-api.data.gouv.fr/api/resources/dbe8a621-a9c4-4bc3-9cae-be1699c5ff25/data/json/?page=1&page_size=5&nom_commune__contains=${encodeURIComponent(q)}`;
          const response = await fetch(url);
          const data = await response.json();
          const communes = data.results || data; // compatibilité éventuelle
          resultsDiv.innerHTML = "";

          if (communes.length === 1) {
            selectCommune(communes[0]);
          } else {
            communes.forEach(c => {
              const item = document.createElement("div");
              item.className = "result-item";
              item.textContent = c.nom_commune_complet;
              item.addEventListener("click", () => selectCommune(c));
              resultsDiv.appendChild(item);
            });
          }
        } catch (err) {
          console.error("Erreur API commune:", err);
        }
      }, 300);
    });

    document.getElementById("loadButton").addEventListener("click", () => {
      const code = document.getElementById("codeInsee").value;
      if (code) loadBothDatasets(code);
    });
  }

  function selectCommune(c) {
    document.getElementById("communeInput").value = c.nom_commune_complet;
    document.getElementById("results").innerHTML = "";
    document.getElementById("codeInsee").value = c.code_commune_INSEE;
    document.getElementById("loadButton").click();
  }

  async function loadBothDatasets(code) {
    const urls = {
      A: `https://cadastre.data.gouv.fr/data/etalab-cadastre/latest/geojson/communes/${code.substring(0,2)}/${code}/cadastre-${code}-parcelles.json.gz`,
      B: `https://cadastre.data.gouv.fr/data/etalab-cadastre/latest/geojson/communes/${code.substring(0,2)}/${code}/cadastre-${code}-batiments.json.gz`
    };
    loadData("A", urls.A);
    loadData("B", urls.B);
  }

  async function loadData(id, url) {
    try {
      document.getElementById(`status_${id}`).textContent = "⏳ Chargement...";
      const response = await fetch(url);
      const buf = new Uint8Array(await response.arrayBuffer());
      let text;
      if (buf[0] === 0x1f && buf[1] === 0x8b) text = pako.ungzip(buf, { to: "string" });
      else text = new TextDecoder("utf-8").decode(buf);

      const geojsonData = JSON.parse(text);

      geojsonData.features.forEach(f => {
        try {
          const area = turf.area(f);
          f.properties.area_m2 = area;
        } catch {
          f.properties.area_m2 = null;
        }
      });

      datasets[id].data = geojsonData;
      document.getElementById(`status_${id}`).textContent = "✅ Chargé.";
      populateFieldSelect(id);
      renderFiltered(id);
    } catch (err) {
      console.error(err);
      document.getElementById(`status_${id}`).textContent = "❌ Erreur de chargement.";
    }
  }

  function populateFieldSelect(id) {
    const ds = datasets[id];
    if (!ds.data) return;
    const fields = Object.keys(ds.data.features[0].properties);
    if (!fields.includes("area_m2")) fields.push("area_m2");
    const sel = document.getElementById(`fieldSelect_${id}`);
    sel.innerHTML = fields.map(f => `<option value="${f}" ${f === "area_m2" ? "selected" : ""}>${f}</option>`).join("");
  }

  function renderFiltered(id) {
    const ds = datasets[id];
    if (!ds.data) return;

    const field = document.getElementById(`fieldSelect_${id}`).value;
    const minVal = parseFloat(document.getElementById(`minValue_${id}`).value);
    const maxVal = parseFloat(document.getElementById(`maxValue_${id}`).value);

    const filtered = {
      type: "FeatureCollection",
      features: ds.data.features.filter(f => {
        const val = parseFloat(f.properties[field]);
        if (isNaN(val)) return false;
        if (!isNaN(minVal) && val < minVal) return false;
        if (!isNaN(maxVal) && val > maxVal) return false;
        return true;
      })
    };

    document.getElementById(`countDisplay_${id}`).textContent = `Nombre : ${filtered.features.length}`;

    if (ds.layer) map.removeLayer(ds.layer);

    ds.layer = L.geoJSON(filtered, {
      style: { color: ds.color, weight: 1, fillOpacity: 0.4 },
      onEachFeature: (f, layer) => {
        const props = f.properties;
        layer.bindPopup(
          `<b>${field}</b>: ${props[field]}<br>` +
          `<b>area_m2</b>: ${props.area_m2 ? props.area_m2.toFixed(2) : "N/A"}<br>` +
          Object.entries(props).map(([k, v]) => `<b>${k}</b>: ${v}`).join("<br>")
        );
      }
    }).addTo(map);

    if (filtered.features.length > 0) map.fitBounds(ds.layer.getBounds());
  }
  </script>

  <style>
    body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; }
    #map { flex: 1; }
    #search {
      background: #f0f0f0; padding: 0.5em; border-bottom: 2px solid #999;
      position: relative;
    }
    #results {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      max-height: 200px;
      overflow-y: auto;
      width: 300px;
      z-index: 1000;
    }
    .result-item {
      padding: 0.3em 0.5em;
      cursor: pointer;
    }
    .result-item:hover {
      background: #def;
    }
    .controls {
      background: #f8f8f8; padding: 0.5em; border-top: 1px solid #ccc;
      display: flex; flex-wrap: wrap; gap: 0.5em; align-items: center;
    }
    input, select, button { padding: 0.3em 0.5em; font-size: 1em; }
    .countDisplay { font-weight: bold; margin-left: 0.5em; }
  </style>
</head>
<body>

  <div id="search">
    <label>Commune :
      <input type="text" id="communeInput" placeholder="Saisir le nom de la commune..." size="40">
    </label>
    <button id="loadButton">Charger les données</button>
    <input type="hidden" id="codeInsee">
    <div id="results"></div>
  </div>

  <!-- Parcelles -->
  <div class="controls">
    <strong>Parcelles :</strong>
    <label>Valeur : <select id="fieldSelect_A"></select></label>
    <label>Min: <input type="number" id="minValue_A" placeholder="min" value="150"></label>
    <label>Max: <input type="number" id="maxValue_A" placeholder="max" value="200"></label>
    <button id="applyFilter_A" onclick="renderFiltered('A')">Filtrer</button>
    <span class="countDisplay" id="countDisplay_A">Nombre : 0</span>
    <span class="status" id="status_A"></span>
  </div>

  <!-- Bâtiments -->
  <div class="controls">
    <strong>Bâtiments :</strong>
    <label>Valeur : <select id="fieldSelect_B"></select></label>
    <label>Min: <input type="number" id="minValue_B" placeholder="min" value="75"></label>
    <label>Max: <input type="number" id="maxValue_B" placeholder="max" value="100"></label>
    <button id="applyFilter_B" onclick="renderFiltered('B')">Filtrer</button>
    <span class="countDisplay" id="countDisplay_B">Nombre : 0</span>
    <span class="status" id="status_B"></span>
  </div>

  <div id="map"></div>

</body>
</html>
