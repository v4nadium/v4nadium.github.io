<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trouver une maison par surface parcelle et bâti</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script type="module">
  import pako from "https://cdn.jsdelivr.net/npm/pako@2.1.0/+esm";
  import * as turf from "https://cdn.jsdelivr.net/npm/@turf/turf@7/+esm";

  let map;
  const datasets = {
    A: { data: null, layer: null, color: "#0074D9" },
    B: { data: null, layer: null, color: "#FF4136" }
  };

  document.addEventListener("DOMContentLoaded", () => {
    initMap();
    initUI("A");
    initUI("B");
  });

  function initMap() {
    map = L.map("map").setView([0, 0], 2);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);
  }

  function initUI(id) {
    document.getElementById(`loadButton_${id}`).addEventListener("click", () => {
      const url = document.getElementById(`geojsonUrl_${id}`).value.trim();
      if (url) {
        document.getElementById(`status_${id}`).textContent = "⏳ Chargement...";
        loadData(id, url);
      }
    });
    document.getElementById(`applyFilter_${id}`).addEventListener("click", () => renderFiltered(id));
  }

  async function loadData(id, url) {
    try {
      const response = await fetch(url);
      const buf = new Uint8Array(await response.arrayBuffer());
      let text;

      // detect gzip magic number
      if (buf[0] === 0x1f && buf[1] === 0x8b) text = pako.ungzip(buf, { to: "string" });
      else text = new TextDecoder("utf-8").decode(buf);

      const geojsonData = JSON.parse(text);

      // compute area
      geojsonData.features.forEach(f => {
        try {
          const area = turf.area(f);
          f.properties.area_m2 = area;
        } catch {
          f.properties.area_m2 = null;
        }
      });

      datasets[id].data = geojsonData;
      document.getElementById(`status_${id}`).textContent = "✅ Chargé.";
      populateFieldSelect(id);
      renderFiltered(id);
    } catch (err) {
      console.error(err);
      document.getElementById(`status_${id}`).textContent = "❌ Erreur de chargement.";
    }
  }

  function populateFieldSelect(id) {
    const ds = datasets[id];
    if (!ds.data) return;
    const fields = Object.keys(ds.data.features[0].properties);
    if (!fields.includes("area_m2")) fields.push("area_m2");
    const sel = document.getElementById(`fieldSelect_${id}`);
    sel.innerHTML = fields.map(f => `<option value="${f}" ${f === "area_m2" ? "selected" : ""}>${f}</option>`).join("");
  }

  function renderFiltered(id) {
    const ds = datasets[id];
    if (!ds.data) return;

    const field = document.getElementById(`fieldSelect_${id}`).value;
    const minVal = parseFloat(document.getElementById(`minValue_${id}`).value);
    const maxVal = parseFloat(document.getElementById(`maxValue_${id}`).value);

    const filtered = {
      type: "FeatureCollection",
      features: ds.data.features.filter(f => {
        const val = parseFloat(f.properties[field]);
        if (isNaN(val)) return false;
        if (!isNaN(minVal) && val < minVal) return false;
        if (!isNaN(maxVal) && val > maxVal) return false;
        return true;
      })
    };

    document.getElementById(`countDisplay_${id}`).textContent = `Nombre : ${filtered.features.length}`;

    if (ds.layer) map.removeLayer(ds.layer);

    ds.layer = L.geoJSON(filtered, {
      style: { color: ds.color, weight: 1, fillOpacity: 0.4 },
      onEachFeature: (f, layer) => {
        const props = f.properties;
        layer.bindPopup(
          `<b>${field}</b>: ${props[field]}<br>` +
          `<b>area_m2</b>: ${props.area_m2 ? props.area_m2.toFixed(2) : "N/A"}<br>` +
          Object.entries(props).map(([k, v]) => `<b>${k}</b>: ${v}`).join("<br>")
        );
      }
    }).addTo(map);

    if (filtered.features.length > 0) map.fitBounds(ds.layer.getBounds());
  }
  </script>

  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      font-family: sans-serif;
    }
    #map { flex: 1; }
    .topbar, .controls {
      background: #f0f0f0;
      padding: 0.5em;
      border-bottom: 1px solid #ccc;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5em;
      align-items: center;
    }
    .controls {
      border-top: 1px solid #ccc;
      border-bottom: none;
    }
    input, select, button { padding: 0.3em 0.5em; font-size: 1em; }
    label { display: flex; align-items: center; gap: 0.3em; }
    .status { font-size: 0.9em; color: #333; }
    .countDisplay { font-weight: bold; margin-left: 0.5em; color: #333; }
    .section {
      border-bottom: 2px solid #aaa;
    }
  </style>
</head>
<body>

  <!-- 🔵 DATASET A -->
  <div class="section" id="sectionA">
    <div class="topbar">
      <strong>Parcelles :</strong>
      <label>URL:
        <input type="text" id="geojsonUrl_A" size="80" value="https://cadastre.data.gouv.fr/data/etalab-cadastre/2025-09-01/geojson/communes/66/66227/cadastre-66227-parcelles.json.gz">
      </label>
      <button id="loadButton_A">Charger les données</button>
      <span class="status" id="status_A"></span>
    </div>
    <div class="controls">
      <label>Valeur :
        <select id="fieldSelect_A"></select>
      </label>
      <label>Min:
        <input type="number" id="minValue_A" placeholder="min">
      </label>
      <label>Max:
        <input type="number" id="maxValue_A" placeholder="max">
      </label>
      <button id="applyFilter_A">Filtrer</button>
      <span class="countDisplay" id="countDisplay_A">Nombre : 0</span>
    </div>
  </div>

  <!-- 🔴 DATASET B -->
  <div class="section" id="sectionB">
    <div class="topbar">
      <strong>Bâtiments :</strong>
      <label>URL:
        <input type="text" id="geojsonUrl_B" size="80" value="https://cadastre.data.gouv.fr/data/etalab-cadastre/2025-09-01/geojson/communes/66/66227/cadastre-66227-batiments.json.gz">
      </label>
      <button id="loadButton_B">Charger les données</button>
      <span class="status" id="status_B"></span>
    </div>
    <div class="controls">
      <label>Valeur :
        <select id="fieldSelect_B"></select>
      </label>
      <label>Min:
        <input type="number" id="minValue_B" placeholder="min">
      </label>
      <label>Max:
        <input type="number" id="maxValue_B" placeholder="max">
      </label>
      <button id="applyFilter_B">Filtrer</button>
      <span class="countDisplay" id="countDisplay_B">Nombre : 0</span>
    </div>
  </div>

  <!-- 🗺️ MAP -->
  <div id="map"></div>

</body>
</html>
