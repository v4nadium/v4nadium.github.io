<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>DT - Extraire l'emprise</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.19.10/proj4.js"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>

<style>
body { font-family: sans-serif; padding: 1em; }
pre { background: #eee; padding: 1em; }
#map { width:100%; height:500px; margin-top:20px; }
button, select { padding: 0.6em; margin-right:10px; }
input::file-selector-button { padding: 0.6em; }
</style>
</head>

<body>

<h2>Extraire les emprises d'une DT</h2>

<p>
Sélectionner un fichier :
<input type="file" id="fileInput" accept=".xml,.gml">
</p>

<p>
Fond de carte :
<select id="basemapSelect">
  <option value="osm">OSM</option>
  <option value="wmts">Orthophoto IGN (WMTS)</option>
</select>

<button id="exportBtn" disabled>Convertir en DXF</button>
</p>

<div id="map"></div>
<pre id="log"></pre>

<script>

/* ===============================
   Projection
=============================== */

proj4.defs("EPSG:2154",
  "+proj=lcc +lat_1=49 +lat_2=44 +lat_0=46.5 " +
  "+lon_0=3 +x_0=700000 +y_0=6600000 " +
  "+ellps=GRS80 +units=m +no_defs"
);

const FROM_EPSG = "EPSG:4326";
const TO_EPSG   = "EPSG:2154";

/* ===============================
   Fonds de carte
=============================== */

const osmLayer = new ol.layer.Tile({
  source: new ol.source.OSM(),
  visible: true
});

const wmtsLayer = new ol.layer.Tile({
  source: new ol.source.XYZ({
    url: "https://data.geopf.fr/wmts?" +
         "SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0" +
         "&LAYER=HR.ORTHOIMAGERY.ORTHOPHOTOS" +
         "&STYLE=normal&TILEMATRIXSET=PM" +
         "&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}" +
         "&FORMAT=image/jpeg",
    crossOrigin: "anonymous"
  }),
  visible: false
});

/* ===============================
   Couche vecteur
=============================== */

const vectorSource = new ol.source.Vector();

const vectorLayer = new ol.layer.Vector({
  source: vectorSource,
  style: new ol.style.Style({
    stroke: new ol.style.Stroke({
      color: 'red',
      width: 2
    }),
    fill: new ol.style.Fill({
      color: 'rgba(255,0,0,0.2)'
    })
  })
});

/* ===============================
   Carte
=============================== */

const map = new ol.Map({
  target: 'map',
  layers: [osmLayer, wmtsLayer, vectorLayer],
  view: new ol.View({
    center: ol.proj.fromLonLat([2.35, 48.85]),
    zoom: 6
  })
});

/* ===============================
   Switch fond
=============================== */

document.getElementById("basemapSelect").addEventListener("change", e => {
  const value = e.target.value;
  osmLayer.setVisible(value === "osm");
  wmtsLayer.setVisible(value === "wmts");
});

/* ===============================
   GML parsing simple
=============================== */

function parseGMLPolygons(xml) {
  const polygons = [];

  const posLists = xml.getElementsByTagNameNS("*", "posList");
  for (const posList of posLists) {
    const nums = posList.textContent.trim().split(/\s+/).map(Number);
    const coords = [];
    for (let i = 0; i < nums.length; i += 2) {
      coords.push([nums[i], nums[i + 1]]);
    }
    polygons.push(coords);
  }

  const coordsEls = xml.getElementsByTagNameNS("*", "coordinates");
  for (const el of coordsEls) {
    const coords = el.textContent.trim()
      .split(/\s+/)
      .map(p => p.split(",").map(Number));
    polygons.push(coords);
  }

  return polygons;
}

/* ===============================
   DXF writer
=============================== */

function dxfHeader() {
  return "0\nSECTION\n2\nENTITIES\n";
}

function dxfFooter() {
  return "0\nENDSEC\n0\nEOF\n";
}

function writePolylineR12(coords) {
  let out = "0\nPOLYLINE\n8\n0\n66\n1\n70\n1\n";
  for (const pt of coords) {
    out += "0\nVERTEX\n8\n0\n";
    out += "10\n" + pt[0].toFixed(3) + "\n";
    out += "20\n" + pt[1].toFixed(3) + "\n";
    out += "30\n0.0\n";
  }
  out += "0\nSEQEND\n";
  return out;
}

/* ===============================
   UI
=============================== */

let dxfContent = "";

document.getElementById("fileInput").addEventListener("change", e => {

  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = evt => {

    const xml = new DOMParser()
      .parseFromString(evt.target.result, "application/xml");

    const log = document.getElementById("log");
    const polygons = parseGMLPolygons(xml);

    if (polygons.length === 0) {
      log.textContent = "Aucune géométrie GML trouvée.";
      return;
    }

    /* ==== Affichage carte ==== */

    vectorSource.clear();

    for (let coords of polygons) {

      const coords3857 = coords.map(p =>
        ol.proj.transform(p, FROM_EPSG, 'EPSG:3857')
      );

      if (
        coords3857[0][0] !== coords3857[coords3857.length - 1][0] ||
        coords3857[0][1] !== coords3857[coords3857.length - 1][1]
      ) {
        coords3857.push(coords3857[0]);
      }

      const feature = new ol.Feature({
        geometry: new ol.geom.Polygon([coords3857])
      });

      vectorSource.addFeature(feature);
    }

    map.getView().fit(vectorSource.getExtent(), {
      padding: [40,40,40,40],
      duration: 800,
      maxZoom: 19
    });

    /* ==== Export DXF ==== */

    dxfContent = dxfHeader();

    for (let coords of polygons) {

      coords = coords.map(p => proj4(FROM_EPSG, TO_EPSG, p));

      const first = coords[0];
      const last  = coords[coords.length - 1];

      if (first[0] !== last[0] || first[1] !== last[1]) {
        coords.push(first);
      }

      dxfContent += writePolylineR12(coords);
    }

    dxfContent += dxfFooter();

    log.textContent =
      `✔ ${polygons.length} polygone(s) détecté(s)\n` +
      `✔ Affichage + Zoom OK\n` +
      `✔ Export DXF prêt`;

    document.getElementById("exportBtn").disabled = false;
  };

  reader.readAsText(file);
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([dxfContent], { type: "application/dxf" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "emprise_dt.dxf";
  a.click();
  URL.revokeObjectURL(url);
});

</script>

</body>
</html>
