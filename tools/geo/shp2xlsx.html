<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SHAPE → XLSX/CSV</title>
  <style>
    body { font-family: Arial, sans-serif; margin:20px; }
    input, button { margin-top: 10px; }
    table { border-collapse: collapse; margin-top: 20px; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 4px; font-size: 12px; }
  </style>
</head>
<body>

<h2>CONVERTIR SHAPE → XLSX/CSV</h2>

<input type="file" id="file-input" multiple accept=".zip,.shp,.dbf,.shx,.prj" />
<br/>

<button id="btn-xlsx" disabled>Exporter en XLSX</button>
<button id="btn-csv" disabled>Exporter en CSV</button>

<div id="message"></div>
<div id="preview"></div>

<!-- Bibliothèques -->
<!--<script src="https://cdn.jsdelivr.net/npm/shpjs@latest/dist/shp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>-->
<script src="./convert-js/shp.min.js"></script>
<script src="./convert-js/xlsx.full.min.js"></script>

<script>
const fileInput = document.getElementById("file-input");
const btnXlsx = document.getElementById("btn-xlsx");
const btnCsv = document.getElementById("btn-csv");
const msg = document.getElementById("message");
const preview = document.getElementById("preview");

let geojsonData = null;
let baseFileName = "export";

// Lire fichiers sélectionnés
fileInput.addEventListener("change", async (ev) => {
  const files = ev.target.files;
  msg.textContent = "Lecture des fichiers…";
  preview.innerHTML = "";
  geojsonData = null;
  btnXlsx.disabled = true;
  btnCsv.disabled = true;

  if (!files.length) {
    msg.textContent = "Aucun fichier sélectionné.";
    return;
  }

  try {
    // Préparer un objet file list pour shp.js
    const fileMap = {};
    for (let f of files) {
      fileMap[f.name] = f;
    }

    const filesArray = Array.from(files);

    // Cherche un ZIP
    const zipFile = filesArray.find(f => /\.zip$/i.test(f.name));
    let data;

    if (zipFile) {
      // ✅ Cas ZIP (le plus simple)
      data = await shp(await zipFile.arrayBuffer());

    } else {
      // ✅ Cas fichiers séparés
      const shpFile = filesArray.find(f => /\.shp$/i.test(f.name));
      const dbfFile = filesArray.find(f => /\.dbf$/i.test(f.name));
      const shxFile = filesArray.find(f => /\.shx$/i.test(f.name));
      const prjFile = filesArray.find(f => /\.prj$/i.test(f.name));

      if (!shpFile || !dbfFile) {
        throw new Error("Il faut au minimum un .shp et un .dbf");
      }

      const source = {
        shp: await shpFile.arrayBuffer(),
        dbf: await dbfFile.arrayBuffer()
      };

      if (shxFile) source.shx = await shxFile.arrayBuffer();
      if (prjFile) source.prj = await prjFile.text();

      data = await shp(source);
    }

    geojsonData = data;

    msg.textContent = "Fichier chargé avec succès. Aperçu des attributs :";

    // Afficher aperçu tableau
    renderPreview(data);

    // Activer boutons export
    btnXlsx.disabled = false;
    btnCsv.disabled = false;

    // Nom du fichier exporté = nom du fichier importé
    if (zipFile) {
      baseFileName = zipFile.name.replace(/\.zip$/i, "");
      data = await shp(await zipFile.arrayBuffer());

    } else {
      const shpFile = filesArray.find(f => /\.shp$/i.test(f.name));
      baseFileName = shpFile.name.replace(/\.shp$/i, "");
    }


  } catch (err) {
    console.error(err);
    msg.textContent = "Erreur lecture des fichiers: " + err;
  }
});

// Aperçu des attributs en HTML
function renderPreview(geojson) {
  if (!geojson || !geojson.features) {
    preview.innerHTML = "Pas de données GeoJSON valides.";
    return;
  }
  const features = geojson.features;
  if (!features.length) {
    preview.innerHTML = "Pas de features.";
    return;
  }
  const keys = Object.keys(features[0].properties);

  let html = "<table><tr>";
  for (let h of keys) html += "<th>" + h + "</th>";
  html += "</tr>";

  for (let f of features) {
    html += "<tr>";
    for (let k of keys) html += "<td>" + (f.properties[k] ?? "") + "</td>";
    html += "</tr>";
  }
  html += "</table>";
  preview.innerHTML = html;
}

// Exporter vers XLSX
btnXlsx.addEventListener("click", () => {
  if (!geojsonData) return;

  const wsData = geojsonData.features.map(f => f.properties);
  const ws = XLSX.utils.json_to_sheet(wsData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Shapefile");

  XLSX.writeFile(wb, `${baseFileName}.xlsx`);
});

// Exporter vers CSV
btnCsv.addEventListener("click", () => {
  if (!geojsonData) return;

  const wsData = geojsonData.features.map(f => f.properties);
  const csv = XLSX.utils.sheet_to_csv(XLSX.utils.json_to_sheet(wsData));
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${baseFileName}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});
</script>

</body>
</html>
