<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>DT - Extraire l'emprise</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.19.10/proj4.js"></script>
  <style>
    body { font-family: sans-serif; padding: 1em; }
    pre { background: #eee; padding: 1em; }
    input { padding: 1em; }
    button { padding: 1am; }
  </style>
</head>
<body>

<h2>Extraire les emprises d'une DT à partir du XML</h2>
<p>Sélectionner un fichier .xml issu d'une DT : <input type="file" id="fileInput" accept=".xml,.gml"></p>
<br><br>
<button id="exportBtn" disabled>Convertir en DXF</button>

<pre id="log"></pre>

<script src="/includes/header-loader.js" defer></script>
<script>
/* ===============================
   Projection (optionnelle)
   =============================== */

proj4.defs("EPSG:2154",
  "+proj=lcc +lat_1=49 +lat_2=44 +lat_0=46.5 " +
  "+lon_0=3 +x_0=700000 +y_0=6600000 " +
  "+ellps=GRS80 +units=m +no_defs"
);

const FROM_EPSG = "EPSG:4326";
const TO_EPSG   = "EPSG:2154";

/* ===============================
   DXF R12 writer
   =============================== */

function dxfHeader() {
  return "0\nSECTION\n2\nENTITIES\n";
}

function dxfFooter() {
  return "0\nENDSEC\n0\nEOF\n";
}

function writePolylineR12(coords) {
  let out = "";

  out += "0\nPOLYLINE\n";
  out += "8\n0\n";      // layer 0
  out += "66\n1\n";     // vertices follow
  out += "70\n1\n";     // closed polyline

  for (const pt of coords) {
    out += "0\nVERTEX\n";
    out += "8\n0\n";
    out += "10\n" + pt[0].toFixed(3) + "\n";
    out += "20\n" + pt[1].toFixed(3) + "\n";
    out += "30\n0.0\n";
  }

  out += "0\nSEQEND\n";
  return out;
}

/* ===============================
   GML parsing
   =============================== */

function parseGMLPolygons(xml) {
  const polygons = [];

  // GML 3.x (posList)
  const posLists = xml.getElementsByTagNameNS("*", "posList");
  for (const posList of posLists) {
    const nums = posList.textContent.trim().split(/\s+/).map(Number);
    const coords = [];
    for (let i = 0; i < nums.length; i += 2) {
      coords.push([nums[i], nums[i + 1]]);
    }
    polygons.push(coords);
  }

  // GML 2.x (coordinates)
  const coordsEls = xml.getElementsByTagNameNS("*", "coordinates");
  for (const el of coordsEls) {
    const coords = el.textContent.trim()
      .split(/\s+/)
      .map(p => p.split(",").map(Number));
    polygons.push(coords);
  }

  return polygons;
}

/* ===============================
   UI
   =============================== */

let dxfContent = "";

document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = evt => {
    const xml = new DOMParser().parseFromString(evt.target.result, "application/xml");
    const log = document.getElementById("log");

    const polygons = parseGMLPolygons(xml);
    if (polygons.length === 0) {
      log.textContent = "Aucune géométrie GML trouvée.";
      return;
    }

    dxfContent = dxfHeader();

    for (let coords of polygons) {

      // reprojection optionnelle
      coords = coords.map(p => proj4(FROM_EPSG, TO_EPSG, p));

      // fermeture explicite du polygone
      const first = coords[0];
      const last  = coords[coords.length - 1];
      if (first[0] !== last[0] || first[1] !== last[1]) {
        coords.push(first);
      }

      dxfContent += writePolylineR12(coords);
    }

    dxfContent += dxfFooter();

    log.textContent =
      `✔ ${polygons.length} polygone(s) détecté(s)\n` +
      `✔ Export DXF R12 prêt`;

    document.getElementById("exportBtn").disabled = false;
  };

  reader.readAsText(file);
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([dxfContent], { type: "application/dxf" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "export_r12.dxf";
  a.click();
  URL.revokeObjectURL(url);
});
</script>

</body>
</html>
